syntax = "proto3";

package events.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/seuusuario/ticketing/gen/events/v1;eventsv1";

// EventsService e a face interna do events-service. O tickets-service vai
// chamar GetEvent antes de reservar ingressos, para validar status e
// capacidade. Nao e exposto para fora do compose.
service EventsService {
  rpc GetEvent(GetEventRequest) returns (GetEventResponse);
  rpc CheckAvailability(CheckAvailabilityRequest) returns (CheckAvailabilityResponse);
}

enum Status {
  STATUS_UNSPECIFIED = 0;
  STATUS_DRAFT = 1;
  STATUS_PUBLISHED = 2;
  STATUS_CANCELLED = 3;
}

message Event {
  string id = 1;
  string name = 2;
  string venue = 3;
  string city = 4;
  google.protobuf.Timestamp starts_at = 5;
  int32 capacity = 6;
  int64 price_cents = 7;
  Status status = 8;
}

message GetEventRequest {
  string id = 1;
}

message GetEventResponse {
  Event event = 1;
}

message CheckAvailabilityRequest {
  string event_id = 1;
  int32 quantity = 2;
}

message CheckAvailabilityResponse {
  bool available = 1;
  int32 capacity = 2;
  string reason = 3;
}
