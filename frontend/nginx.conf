server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Tudo que e API/documentacao vai para o events-service; assim o navegador
    # fala so com este host (sem CORS).
    location ~ ^/(api/|docs|openapi.yaml|healthz|readyz) {
        proxy_pass http://events-service:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
    }

    location / {
        try_files $uri /index.html;
    }
}
